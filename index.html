<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALTIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app-header"></div>

  <section class="relative overflow-hidden bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 py-12 px-4 border-b border-slate-800">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
      <div class="space-y-4 max-w-2xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 text-cyan-300 rounded-full text-xs font-semibold border border-cyan-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span data-i18n="heroBadge"></span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-black leading-tight" data-i18n="heroTitle"></h1>
        <p class="text-slate-200 text-lg max-w-xl leading-relaxed" data-i18n="heroText"></p>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto text-xs">
        <div class="bg-slate-800/80 px-4 py-3.5 rounded-2xl border border-slate-700/60 flex items-center gap-3">
          <i class="fa-solid fa-box text-cyan-400 text-xl"></i>
          <div>
            <div class="font-bold text-white" data-i18n="lockersCard"></div>
            <div class="text-slate-400 text-[10px]" data-i18n="lockersCardSub"></div>
          </div>
        </div>
        <div class="bg-slate-800/80 px-4 py-3.5 rounded-2xl border border-slate-700/60 flex items-center gap-3">
          <i class="fa-solid fa-user-check text-emerald-400 text-xl"></i>
          <div>
            <div class="font-bold text-white" data-i18n="verifiedCard"></div>
            <div class="text-slate-400 text-[10px]" data-i18n="verifiedCardSub"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between pb-6 border-b border-slate-800 gap-4">
      <div id="catButtons" class="flex items-center gap-2 overflow-x-auto"></div>
      <div class="flex flex-wrap items-center gap-3">
        <input id="searchInput" type="search" data-i18n-placeholder="searchPh" class="w-full sm:w-72 pl-3 pr-3 py-3 bg-slate-800/80 border border-slate-700/60 rounded-2xl text-base text-slate-200 placeholder-slate-500 focus:border-cyan-500 focus:outline-none">
        <select id="countryFilter" class="bg-slate-800 border border-slate-700 text-base font-bold text-slate-200 rounded-xl px-3 py-3"></select>
      </div>
    </div>
    <p id="crumb" class="mt-4 text-base text-slate-400"></p>
    <div id="subGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4"></div>
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-8"></div>
  </main>

  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/lockers-pack.js"></script>
  <script src="js/baltiq.js"></script>
  <script>
    Baltiq.injectChrome("catalog");
    document.getElementById("countryFilter").innerHTML = `
      <option value="all">${Baltiq.t("allBaltics")}</option>
      <option value="LV">${Baltiq.t("lv")} 🇱🇻</option>
      <option value="LT">${Baltiq.t("lt")} 🇱🇹</option>
      <option value="EE">${Baltiq.t("ee")} 🇪🇪</option>`;
    let currentCategory = "all";
    let currentGroup = "";
    let currentLeaf = "";

    function allItems() {
      return Baltiq.getProducts();
    }

    function countIn(ids) {
      const list = allItems();
      return list.filter((p) => ids.includes(p.subcategory)).length;
    }

    function renderCats() {
      const wrap = document.getElementById("catButtons");
      wrap.innerHTML = Object.entries(Baltiq.getCategories()).map(([id, label]) => {
        const on = currentCategory === id;
        return `<button data-cat="${id}" class="cat-btn shrink-0 px-5 py-3 rounded-xl text-base font-bold ${on ? "bg-cyan-500 text-slate-900" : "bg-slate-800 text-slate-300 border border-slate-700/60"}">${label}</button>`;
      }).join("");
      wrap.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          currentCategory = btn.dataset.cat;
          currentGroup = "";
          currentLeaf = "";
          renderCats();
          render();
        };
      });
    }

    function tile(id, label, n) {
      return `<button data-id="${id}" class="pick text-left bg-slate-800 border border-slate-700 hover:border-cyan-400 rounded-2xl px-5 py-4">
        <span class="text-lg font-bold block">${label}</span>
        <span class="text-slate-400 text-sm">${n} шт.</span>
      </button>`;
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const country = document.getElementById("countryFilter").value;
      const crumb = document.getElementById("crumb");
      const subGrid = document.getElementById("subGrid");
      const groups = Baltiq.SUBCATEGORIES[currentCategory] || [];
      const tree = Baltiq.SUB_TREE || {};
      const hasGroups = currentCategory !== "all" && groups.length && groups[0] !== "other";

      let path = Baltiq.t("cat." + currentCategory);
      if (currentGroup) path += " → " + Baltiq.subLabel(currentGroup);
      if (currentLeaf) path += " → " + Baltiq.subLabel(currentLeaf);
      crumb.textContent = currentCategory === "all" ? "" : path;

      subGrid.innerHTML = "";
      let showProducts = true;

      if (hasGroups && !currentGroup) {
        showProducts = false;
        subGrid.innerHTML = groups.map((id) => {
          const kids = tree[id] || [id];
          return tile(id, Baltiq.subLabel(id), countIn(kids.concat(id)));
        }).join("");
        subGrid.querySelectorAll(".pick").forEach((b) => {
          b.onclick = () => {
            currentGroup = b.dataset.id;
            currentLeaf = "";
            render();
          };
        });
      } else if (currentGroup && tree[currentGroup] && !currentLeaf) {
        showProducts = false;
        const kids = tree[currentGroup];
        subGrid.innerHTML = `<button id="up" class="sm:col-span-2 lg:col-span-3 text-left text-cyan-400 font-bold py-2">${Baltiq.t("back")}</button>` +
          kids.map((id) => tile(id, Baltiq.subLabel(id), countIn([id]))).join("");
        document.getElementById("up").onclick = () => { currentGroup = ""; currentLeaf = ""; render(); };
        subGrid.querySelectorAll(".pick").forEach((b) => {
          b.onclick = () => { currentLeaf = b.dataset.id; render(); };
        });
      } else if (currentLeaf || (currentGroup && !tree[currentGroup])) {
        subGrid.innerHTML = `<button id="up" class="text-left text-cyan-400 font-bold py-2">${Baltiq.t("back")}</button>`;
        document.getElementById("up").onclick = () => {
          if (currentLeaf) currentLeaf = "";
          else currentGroup = "";
          render();
        };
      }

      const items = allItems().filter((item) => {
        const catOk = currentCategory === "all" || item.category === currentCategory;
        const countryOk = country === "all" || item.country === country;
        const qOk = !q || Baltiq.adText(item).toLowerCase().includes(q) || item.city.toLowerCase().includes(q);
        let subOk = true;
        if (currentLeaf) subOk = item.subcategory === currentLeaf;
        else if (currentGroup) subOk = Baltiq.inSubGroup(item, currentGroup);
        return catOk && countryOk && qOk && subOk;
      });

      const grid = document.getElementById("productGrid");
      if (!showProducts && !q) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-lg">${Baltiq.t("pickSection")}</div>`;
        return;
      }
      grid.innerHTML = items.length
        ? items.map(Baltiq.productCard).join("")
        : `<div class="col-span-full text-center py-12 text-slate-400 text-lg">${Baltiq.t("empty")}</div>`;
    }

    document.getElementById("searchInput").oninput = render;
    document.getElementById("countryFilter").onchange = render;
    renderCats();
    render();
  </script>
</body>
</html>
