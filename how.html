<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALTIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app-header"></div>
  <main class="max-w-3xl mx-auto px-4 py-12 space-y-8">
    <h1 class="text-3xl font-black" data-i18n="howTitle"></h1>
    <p class="text-slate-200 text-lg leading-relaxed" data-i18n="howLead"></p>
    <ol class="space-y-4 text-lg">
      <li class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6"><strong class="text-cyan-400">1.</strong> <span data-i18n="how1"></span></li>
      <li class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6"><strong class="text-cyan-400">2.</strong> <span data-i18n="how2"></span></li>
      <li class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6"><strong class="text-cyan-400">3.</strong> <span data-i18n="how3"></span></li>
      <li class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6"><strong class="text-cyan-400">4.</strong> <span data-i18n="how4"></span></li>
      <li class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6"><strong class="text-cyan-400">5.</strong> <span data-i18n="how5"></span></li>
    </ol>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/lockers-pack.js"></script>
  <script src="js/baltiq.js"></script>
  <script>Baltiq.injectChrome("how");</script>
</body>
</html>
