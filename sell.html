<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALTIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app-header"></div>
  <main class="max-w-2xl mx-auto px-4 py-10">
    <div id="box" class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 space-y-5"></div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/lockers-pack.js"></script>
  <script src="js/baltiq.js"></script>
  <script>
    Baltiq.injectChrome("catalog");
    if (!Baltiq.requireVerified(Baltiq.t("sellNeedVerify"))) throw new Error("login");
    const user = Baltiq.getUser();
    const box = document.getElementById("box");
    let step = 1, cat = "", group = "", sub = "";
    const cats = Baltiq.CATEGORY_IDS.filter((id) => id !== "all");

    function paint() {
      if (step === 1) {
        box.innerHTML = `<h1 class="text-2xl font-black">${Baltiq.t("stepCat")}</h1>
          <p class="text-base text-amber-200">${Baltiq.t("packOnly")}</p>
          <div class="grid sm:grid-cols-2 gap-3">${cats.map((id) =>
            `<button data-cat="${id}" class="pick bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-2xl p-5 text-lg font-bold text-left">${Baltiq.t("cat." + id)}</button>`
          ).join("")}</div>`;
        box.querySelectorAll(".pick").forEach((b) => b.onclick = () => { cat = b.dataset.cat; step = 2; paint(); });
        return;
      }
      if (step === 2) {
        const subs = Baltiq.SUBCATEGORIES[cat] || ["other"];
        box.innerHTML = `<button id="back" class="text-base text-cyan-400 font-bold">${Baltiq.t("back")}</button>
          <h1 class="text-2xl font-black">${Baltiq.t("stepSub")}</h1>
          <div class="grid sm:grid-cols-2 gap-3">${subs.map((id) =>
            `<button data-sub="${id}" class="pick bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-2xl p-5 text-lg font-bold text-left">${Baltiq.subLabel(id)}</button>`
          ).join("")}</div>`;
        document.getElementById("back").onclick = () => { step = 1; paint(); };
        box.querySelectorAll(".pick").forEach((b) => b.onclick = () => {
          group = b.dataset.sub;
          const kids = (Baltiq.SUB_TREE && Baltiq.SUB_TREE[group]) || [];
          if (kids.length) { step = 25; paint(); }
          else { sub = group; step = 3; paint(); }
        });
        return;
      }
      if (step === 25) {
        const kids = Baltiq.SUB_TREE[group] || [];
        box.innerHTML = `<button id="back" class="text-base text-cyan-400 font-bold">${Baltiq.t("back")}</button>
          <h1 class="text-2xl font-black">${Baltiq.t("stepType")}</h1>
          <p class="text-base text-slate-300">${Baltiq.t("cat." + cat)} → ${Baltiq.subLabel(group)}</p>
          <div class="grid sm:grid-cols-2 gap-3">${kids.map((id) =>
            `<button data-sub="${id}" class="pick bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-2xl p-5 text-lg font-bold text-left">${Baltiq.subLabel(id)}</button>`
          ).join("")}</div>`;
        document.getElementById("back").onclick = () => { step = 2; paint(); };
        box.querySelectorAll(".pick").forEach((b) => b.onclick = () => { sub = b.dataset.sub; step = 3; paint(); });
        return;
      }
      box.innerHTML = `<form id="form" class="space-y-5">
        <button type="button" id="back" class="text-base text-cyan-400 font-bold">${Baltiq.t("back")}</button>
        <h1 class="text-2xl font-black">${Baltiq.t("stepForm")}</h1>
        <p class="text-base text-slate-300">${Baltiq.t("cat." + cat)} → ${Baltiq.subLabel(group || sub)}${group && sub !== group ? " → " + Baltiq.subLabel(sub) : ""}</p>
        <p class="text-base font-bold text-amber-200">${Baltiq.t("sellFree")}</p>
        <label class="block font-bold">${Baltiq.t("sellCity")}<input id="city" required class="mt-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></label>
        <label class="block font-bold">${Baltiq.t("sellCountry")}<select id="country" class="mt-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3">
          <option value="LV">${Baltiq.t("lv")}</option><option value="LT">${Baltiq.t("lt")}</option><option value="EE">${Baltiq.t("ee")}</option>
        </select></label>
        <label class="block font-bold">${Baltiq.t("sellPrice")}<input id="price" type="number" min="1" required class="mt-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></label>
        <label class="block font-bold">${Baltiq.t("condition")}<select id="condition" class="mt-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3">
          <option value="new">${Baltiq.optLabel("new")}</option>
          <option value="used" selected>${Baltiq.optLabel("used")}</option>
        </select></label>
        <label class="block font-bold">${Baltiq.t("sellPhotos")}<input id="photos" type="file" accept="image/*" multiple class="mt-2 w-full"></label>
        <label class="block font-bold">${Baltiq.t("sellDesc")}<textarea id="description" rows="6" required class="mt-2 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></textarea></label>
        <button class="w-full bg-cyan-500 text-slate-900 font-bold py-4 rounded-xl text-lg">${Baltiq.t("sellPublish")}</button>
      </form>`;
      document.getElementById("back").onclick = () => { step = Baltiq.SUB_TREE[group] ? 25 : 2; paint(); };
      document.getElementById("country").value = user.country;
      document.getElementById("city").value = user.city || "";
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const files = [...document.getElementById("photos").files].slice(0, 4);
        const uploaded = await Promise.all(files.map((file) => new Promise((res) => {
          const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
        })));
        const price = Number(document.getElementById("price").value);
        const text = document.getElementById("description").value.trim();
        const product = {
          id: "p" + Date.now(),
          title: text,
          category: cat,
          subcategory: sub,
          country: document.getElementById("country").value,
          city: document.getElementById("city").value.trim(),
          price_eur: price,
          price_points: Baltiq.eurToPts(price),
          seller: user.name,
          verified: true,
          condition: document.getElementById("condition").value,
          images: uploaded,
          image: uploaded[0] || "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=800&q=80",
          description: text,
        };
        Baltiq.setProducts([product, ...Baltiq.getProducts()]);
        location.href = "product.html?id=" + encodeURIComponent(product.id);
      };
    }
    paint();
  </script>
</body>
</html>
